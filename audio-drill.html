<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>French Trainer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/0.9.4/css/bulma.min.css">
    <style>
        .container { max-width: 600px; margin: auto; text-align: center; }
        #displayWord { font-size: 24px; font-weight: bold; margin-top: 20px; min-height: 100px; display: flex; align-items: center; justify-content: center; }
        #progress { margin-top: 10px; font-size: 18px; min-height: 30px; }
        .buttons { margin-top: 20px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">French Pronunciation Trainer</h1>
        <div class="field has-text-left hidden" id="library"></div>
        <div class="field">
            <div class="file has-name is-boxed">
                <label class="file-label">
                    <input class="file-input" type="file" id="fileInput" accept=".txt" multiple>
                    <span class="file-cta">
                        <span class="file-label">Choose files…</span>
                    </span>
                </label>
            </div>
        </div>
        <div class="field">
            <label class="label">Repetitions</label>
            <div class="control">
                <input class="input" type="number" id="repetitions" min="1" value="1">
            </div>
        </div>
        <div class="field">
            <label class="checkbox">
                <input type="checkbox" id="randomize"> Randomize
            </label>
        </div>
        <div id="progress" class="notification is-light"></div>
        <div id="speechError" class="notification is-danger is-light" style="display: none;"></div>
        <div id="displayWord" class="box has-background-light"></div>
        <div class="buttons">
            <button class="button is-primary" id="trainButton">Train</button>
            <button class="button is-warning" id="pauseButton">Pause</button>
            <button class="button is-danger" id="stopButton">Stop</button>
        </div>
    </div>
    <script src="library.js"></script>
    <script>
        let isTraining = false;
        let isPaused = false;
        let currentIteration = 0;
        let totalIterations = 0;
        let totalEntries = 0;
        let currentEntry = 0;
        let entries = [];

        const MAX_SPEAK_ATTEMPTS = 3;
        const STALL_TIMEOUT_MS = 1500;
        // Chrome can silently drop an utterance if nothing keeps a reference
        // to it alive while the engine gets around to it — keep it pinned
        // here until it's done.
        const pendingUtterances = [];

        function removeSlashes(word) {
            return word.replace(/\s*\/\s*/g, ", ");
        }

        function cleanFrenchWord(word) {
            return removeSlashes(word
                .replace(/\(.*?\)/g, "")
                .replace(/\s+/g, " ")
                .trim());
        }

        async function train(repetitions) {
            totalIterations = repetitions;
            totalEntries = entries.length;
            isTraining = true;
            isPaused = false;

            const displayWord = document.getElementById("displayWord");
            const progress = document.getElementById("progress");
            const speechError = document.getElementById("speechError");
            speechError.style.display = "none";

            const stopTrainingWithError = (message) => {
                isTraining = false;
                isPaused = false;
                speechSynthesis.cancel();
                document.getElementById("pauseButton").textContent = "Pause";
                displayWord.textContent = "";
                progress.textContent = "";
                speechError.textContent = message;
                speechError.style.display = "block";
            };

            const speak = (text, lang) => {
                return new Promise(resolve => {
                    if (!isTraining) return resolve();

                    let attempt = 0;
                    const attemptSpeak = () => {
                        attempt++;
                        const utterance = new SpeechSynthesisUtterance(text);
                        utterance.lang = lang;
                        pendingUtterances.push(utterance);

                        let settled = false;
                        let started = false;
                        let stallTimer = null;

                        const forget = () => {
                            const i = pendingUtterances.indexOf(utterance);
                            if (i !== -1) pendingUtterances.splice(i, 1);
                            clearTimeout(stallTimer);
                        };

                        const giveUp = () => {
                            settled = true;
                            forget();
                            stopTrainingWithError(
                                `⚠️ Speech failed for "${text}" (${lang}). This can happen when a network voice ` +
                                `stops responding — often after a browser or Windows update changes voice availability. ` +
                                `Training stopped; check Settings > Time & Language > Speech, or try again.`
                            );
                            resolve();
                        };

                        // Network voices can occasionally just never start — no
                        // error event, no end event. Detect that stall and retry
                        // a couple of times before giving up and telling the user.
                        const checkStall = () => {
                            if (started || settled) return;
                            if (speechSynthesis.speaking) {
                                stallTimer = setTimeout(checkStall, STALL_TIMEOUT_MS);
                                return;
                            }
                            forget();
                            speechSynthesis.cancel();
                            if (attempt < MAX_SPEAK_ATTEMPTS) {
                                attemptSpeak();
                            } else {
                                giveUp();
                            }
                        };
                        stallTimer = setTimeout(checkStall, STALL_TIMEOUT_MS);

                        utterance.onstart = () => { started = true; displayWord.textContent = text; };
                        utterance.onend = () => {
                            if (settled) return;
                            settled = true;
                            forget();
                            setTimeout(() => { displayWord.textContent = ""; resolve(); }, 500);
                        };
                        utterance.onerror = () => {
                            if (settled) return;
                            forget();
                            if (!started && attempt < MAX_SPEAK_ATTEMPTS) {
                                attemptSpeak();
                            } else {
                                giveUp();
                            }
                        };

                        speechSynthesis.speak(utterance);
                    };

                    attemptSpeak();
                });
            };

            for (currentIteration = 0; currentIteration < repetitions && isTraining; currentIteration++) {
                for (currentEntry = 0; currentEntry < entries.length; currentEntry++) {
                    if (!isTraining) return;
                    while (isPaused) await new Promise(res => setTimeout(res, 200));

                    progress.textContent = `Iteration: ${currentIteration + 1}/${totalIterations} | Pronounced: ${currentEntry + 1}/${totalEntries}`;
                    await speak(entries[currentEntry].french, "fr-CA");
                    if (!isTraining) return;
                    await speak(entries[currentEntry].english, "en-US");
                    if (!isTraining) return;
                    await new Promise(res => setTimeout(res, 1000));
                }
            }
        }

        const libraryTexts = mountLibraryChecklist(document.getElementById("library"), "vocab");

        document.getElementById("trainButton").addEventListener("click", async () => {
            const files = document.getElementById("fileInput").files;
            const texts = await (await libraryTexts)();
            for (let file of files) texts.push(await file.text());
            if (texts.length === 0) {
                alert("Please select at least one file.");
                return;
            }

            const repetitions = parseInt(document.getElementById("repetitions").value, 10);
            const randomize = document.getElementById("randomize").checked;
            entries = [];

            for (let text of texts) {
                const fileEntries = text.split("\n").map(line => {
                    const parts = line.split("\t");
                    return parts.length >= 2 ? { french: cleanFrenchWord(parts[0].trim()), english: removeSlashes(parts[1].trim()) } : null;
                }).filter(Boolean);
                entries.push(...fileEntries);
            }

            if (randomize) {
                entries = entries.sort(() => Math.random() - 0.5);
            }

            train(repetitions);
        });

        document.getElementById("pauseButton").addEventListener("click", () => {
            isPaused = !isPaused;
            document.getElementById("pauseButton").textContent = isPaused ? "Resume" : "Pause";
        });

        document.getElementById("stopButton").addEventListener("click", () => {
            isTraining = false;
            isPaused = false;
            speechSynthesis.cancel();
            document.getElementById("displayWord").textContent = "";
            document.getElementById("progress").textContent = "";
            document.getElementById("speechError").style.display = "none";
        });
    </script>
</body>
</html>
