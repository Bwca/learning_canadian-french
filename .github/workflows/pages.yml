name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html library.js _site/
          # Every top-level folder with an index.html is a language; publish it minus the non-web parts.
          for lang in */; do
            lang="${lang%/}"
            [ -f "$lang/index.html" ] || continue
            cp -r "$lang" _site/
            rm -rf "_site/$lang/pronunciation-generator" "_site/$lang/tef-prep" "_site/$lang"/*.md
          done
          node .github/scripts/build-manifest.js _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
