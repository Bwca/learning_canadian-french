<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>French Trainer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/0.9.4/css/bulma.min.css">
    <style>
        .container { max-width: 600px; margin: auto; text-align: center; }
        #displayWord, .display-probe { font-size: 24px; font-weight: bold; margin-top: 20px; min-height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        /* Fonts with full IPA coverage, so combining marks like the nasal tilde in ɑ̃ sit on their letter. */
        .translation { font-size: 22px; font-weight: normal; margin-top: 12px; }
        .ipa { font-family: "Charis SIL", "Doulos SIL", "Gentium Plus", "Segoe UI", "Lucida Sans Unicode", "DejaVu Sans", sans-serif; font-size: 20px; font-weight: normal; color: #4a4a4a; margin-top: 4px; }
        #progress { margin-top: 10px; font-size: 18px; min-height: 30px; }
        .buttons { margin-top: 20px; }
        /* Plain buttons, and no blue ring left on a tapped one; keyboard focus still shows it. */
        .buttons .button:focus:not(:focus-visible) { border-color: #dbdbdb; box-shadow: none; }
        .hidden { display: none; }
        #library summary, #preview summary { cursor: pointer; font-weight: 600; }
        #preview td { vertical-align: middle; }
        #preview .say { cursor: pointer; }
        #preview .ipa { font-size: 0.9em; margin-top: 0; }
        /* Full screen: just the progress, word box and buttons, centred, with bigger text. Where the
           Fullscreen API isn't available (iPhone Safari) it fills the browser window instead. */
        #drillArea.focus-mode { position: fixed; inset: 0; z-index: 100; background: #fff; display: flex; flex-direction: column; justify-content: center; padding: 1.5rem; overflow: auto; }
        #drillArea.focus-mode > * { width: 100%; max-width: 900px; margin-left: auto; margin-right: auto; }
        .focus-mode #displayWord, .focus-mode .display-probe { font-size: 36px; }
        .focus-mode .translation { font-size: 30px; }
        .focus-mode .ipa { font-size: 28px; }
        .focus-mode .buttons { justify-content: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">French Pronunciation Trainer</h1>
        <div class="field has-text-left hidden" id="library"></div>
        <div class="field">
            <div class="file has-name is-boxed">
                <label class="file-label">
                    <input class="file-input" type="file" id="fileInput" accept=".txt" multiple>
                    <span class="file-cta">
                        <span class="file-label">Choose files…</span>
                    </span>
                </label>
            </div>
        </div>
        <details class="field has-text-left hidden" id="preview">
            <summary id="previewSummary"></summary>
            <p class="help">Untick entries to leave them out of the session; tap a French word to hear it.</p>
            <div id="previewList"></div>
        </details>
        <div class="field">
            <label class="label" for="voiceSelect">French voice</label>
            <div class="control">
                <div class="select">
                    <select id="voiceSelect"></select>
                </div>
            </div>
            <p id="voiceIndicator" class="help" aria-live="polite"></p>
        </div>
        <div class="field">
            <label class="label" for="speechRate">French speech speed: <span id="speechRateValue">100%</span></label>
            <div class="control">
                <input type="range" id="speechRate" min="0.5" max="1.5" step="0.1" value="1">
            </div>
        </div>
        <div class="field">
            <label class="label">Repetitions</label>
            <div class="control">
                <input class="input" type="number" id="repetitions" min="1" value="1">
            </div>
        </div>
        <div class="field">
            <label class="checkbox">
                <input type="checkbox" id="randomize"> Randomize
            </label>
        </div>
        <div class="field hidden" id="keepAwakeField">
            <label class="checkbox">
                <input type="checkbox" id="keepAwake"> Keep screen on
            </label>
            <p class="help">Phones stop the speech when the screen turns off; this keeps it from timing out while the page is open.</p>
        </div>
        <div id="drillArea">
            <div id="progress" class="notification is-light"></div>
            <div id="speechError" class="notification is-danger is-light" style="display: none;"></div>
            <div id="displayWord" class="box has-background-light"></div>
            <div class="buttons">
                <button class="button" id="trainButton">Train</button>
                <button class="button" id="pauseButton">Pause</button>
                <button class="button" id="stopButton">Stop</button>
                <button class="button" id="focusButton">Full screen</button>
            </div>
        </div>
    </div>
    <script src="../library.js"></script>
    <script>
        let isTraining = false;
        let isPaused = false;
        let currentIteration = 0;
        let totalIterations = 0;
        let totalEntries = 0;
        let currentEntry = 0;
        let entries = [];

        const MAX_SPEAK_ATTEMPTS = 3;
        const STALL_TIMEOUT_MS = 1500;
        // Chrome can silently drop an utterance if nothing keeps a reference
        // to it alive while the engine gets around to it — keep it pinned
        // here until it's done.
        const pendingUtterances = [];

        let frenchVoices = [];
        let selectedVoice = null;

        const voiceSelect = document.getElementById("voiceSelect");
        const voiceIndicator = document.getElementById("voiceIndicator");
        const VOICE_STORAGE_KEY = "audioDrillVoiceURI";
        const SPEECH_RATE_KEY = "audioDrillSpeechRate";
        const KEEP_AWAKE_KEY = "audioDrillKeepAwake";

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function populateVoices() {
            const voices = speechSynthesis.getVoices();
            frenchVoices = voices.filter(v => v.lang.toLowerCase().startsWith("fr"));

            if (frenchVoices.length === 0) {
                voiceSelect.innerHTML = `<option value="">No French voice installed</option>`;
                voiceIndicator.textContent = "⚠️ No fr-* voice found on this system — speech will fall back to the default system voice.";
                selectedVoice = null;
                return;
            }

            const savedURI = sessionStorage.getItem(VOICE_STORAGE_KEY);
            voiceSelect.innerHTML = frenchVoices
                .map(v => `<option value="${escapeHtml(v.voiceURI)}">${escapeHtml(v.name)} (${escapeHtml(v.lang)})</option>`)
                .join("");

            const savedVoice = frenchVoices.find(v => v.voiceURI === savedURI);
            // Prefer a local (on-device) fr-CA voice — network voices can
            // silently fail to speak the first time or two.
            const localCaVoice = frenchVoices.find(v => v.lang.toLowerCase() === "fr-ca" && v.localService);
            const anyCaVoice = frenchVoices.find(v => v.lang.toLowerCase() === "fr-ca");
            const anyLocalVoice = frenchVoices.find(v => v.localService);
            selectedVoice = savedVoice || localCaVoice || anyCaVoice || anyLocalVoice || frenchVoices[0];
            voiceSelect.value = selectedVoice.voiceURI;
            describeSelectedVoice();
        }

        function describeSelectedVoice() {
            if (!selectedVoice) return;
            const networkNote = selectedVoice.localService
                ? ""
                : " — this is a network voice; if it stays silent on the first click or two, try a local voice instead if one is listed";
            voiceIndicator.textContent = `🔊 Using: ${selectedVoice.name} (${selectedVoice.lang})${networkNote}`;
        }

        voiceSelect.addEventListener("change", () => {
            selectedVoice = frenchVoices.find(v => v.voiceURI === voiceSelect.value) || null;
            if (selectedVoice) {
                sessionStorage.setItem(VOICE_STORAGE_KEY, selectedVoice.voiceURI);
                describeSelectedVoice();
            }
        });

        populateVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoices;
        }

        // --- Speech speed control (slower French for new learners; English stays at normal speed) ---
        const speechRateInput = document.getElementById("speechRate");
        const speechRateValue = document.getElementById("speechRateValue");
        let speechRate = parseFloat(localStorage.getItem(SPEECH_RATE_KEY)) || 1;

        function applySpeechRate() {
            speechRateInput.value = speechRate;
            speechRateValue.textContent = `${Math.round(speechRate * 100)}%`;
        }

        speechRateInput.addEventListener("input", () => {
            speechRate = parseFloat(speechRateInput.value);
            localStorage.setItem(SPEECH_RATE_KEY, speechRate);
            applySpeechRate();
        });
        applySpeechRate();

        // --- Keep screen on (Screen Wake Lock API; the browser drops the lock whenever the page is hidden) ---
        const keepAwakeInput = document.getElementById("keepAwake");
        let wakeLock = null;

        async function updateWakeLock() {
            if (keepAwakeInput.checked && document.visibilityState === "visible") {
                if (wakeLock) return;
                try {
                    wakeLock = await navigator.wakeLock.request("screen");
                    wakeLock.addEventListener("release", () => { wakeLock = null; });
                } catch (e) {
                    wakeLock = null;
                }
            } else if (wakeLock) {
                wakeLock.release();
                wakeLock = null;
            }
        }

        if ("wakeLock" in navigator) {
            document.getElementById("keepAwakeField").classList.remove("hidden");
            keepAwakeInput.checked = localStorage.getItem(KEEP_AWAKE_KEY) === "true";
            keepAwakeInput.addEventListener("change", () => {
                localStorage.setItem(KEEP_AWAKE_KEY, keepAwakeInput.checked);
                updateWakeLock();
            });
            document.addEventListener("visibilitychange", updateWakeLock);
            updateWakeLock();
        }

        function removeSlashes(word) {
            return word.replace(/\s*\/\s*/g, ", ");
        }

        function cleanFrenchWord(word) {
            return removeSlashes(word
                .replace(/\(.*?\)/g, "")
                .replace(/\s+/g, " ")
                .trim());
        }

        // Shows the French word, with its IPA transcription underneath when the file has one,
        // and the English translation below that once it's being read, so the French stays visible.
        // The translation line is always laid out (just invisible until read) so the box doesn't jump in height.
        function renderEntry(box, entry, withTranslation) {
            box.textContent = entry.french;
            if (entry.ipa) {
                const ipaLine = document.createElement("div");
                ipaLine.className = "ipa";
                ipaLine.lang = "fr-fonipa";
                ipaLine.textContent = entry.ipa;
                box.appendChild(ipaLine);
            }
            const translationLine = document.createElement("div");
            translationLine.className = "translation";
            translationLine.lang = "en";
            translationLine.textContent = entry.english;
            if (!withTranslation) translationLine.style.visibility = "hidden";
            box.appendChild(translationLine);
        }

        // Sizes the box for the tallest entry in the set, so it doesn't jump between words.
        // Every entry is laid out at once in invisible copies of the box at the same width (one
        // layout pass, so it stays fast for big sets); wrapping depends on that width, so it's
        // redone when the window is resized or the phone rotated.
        function reserveDisplayHeight() {
            const displayWord = document.getElementById("displayWord");
            if (entries.length === 0) return;
            const holder = document.createElement("div");
            holder.style.cssText = `position: absolute; visibility: hidden; left: 0; top: 0; width: ${displayWord.offsetWidth}px;`;
            for (const entry of entries) {
                const probe = displayWord.cloneNode(false);
                probe.removeAttribute("id");
                probe.removeAttribute("style");
                probe.classList.add("display-probe");
                renderEntry(probe, entry, true);
                holder.appendChild(probe);
            }
            displayWord.parentNode.appendChild(holder);
            const tallest = Math.max(...Array.from(holder.children, probe => probe.offsetHeight));
            holder.remove();
            displayWord.style.minHeight = `${tallest}px`;
        }

        // --- Full screen (just the drill area, for concentrating) ---
        const drillArea = document.getElementById("drillArea");
        const focusButton = document.getElementById("focusButton");

        function setFocusMode(on) {
            drillArea.classList.toggle("focus-mode", on);
            focusButton.textContent = on ? "Exit full screen" : "Full screen";
            reserveDisplayHeight();
        }

        focusButton.addEventListener("click", () => {
            if (drillArea.classList.contains("focus-mode")) {
                if (document.fullscreenElement) document.exitFullscreen();
                setFocusMode(false);
            } else {
                setFocusMode(true);
                if (drillArea.requestFullscreen) drillArea.requestFullscreen().catch(() => {});
            }
        });
        // Leaving real full screen with Esc or the back gesture also leaves focus mode.
        document.addEventListener("fullscreenchange", () => {
            if (!document.fullscreenElement) setFocusMode(false);
        });
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && drillArea.classList.contains("focus-mode")) setFocusMode(false);
        });

        let resizeTimer = null;
        window.addEventListener("resize", () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(reserveDisplayHeight, 200);
        });

        async function train(repetitions) {
            totalIterations = repetitions;
            totalEntries = entries.length;
            isTraining = true;
            isPaused = false;

            const displayWord = document.getElementById("displayWord");
            const progress = document.getElementById("progress");
            const speechError = document.getElementById("speechError");
            speechError.style.display = "none";

            const stopTrainingWithError = (message) => {
                isTraining = false;
                isPaused = false;
                speechSynthesis.cancel();
                document.getElementById("pauseButton").textContent = "Pause";
                displayWord.textContent = "";
                progress.textContent = "";
                speechError.textContent = message;
                speechError.style.display = "block";
            };

            const showEntry = (entry, withTranslation) => renderEntry(displayWord, entry, withTranslation);
            reserveDisplayHeight();

            const speak = (text, lang, onStart) => {
                return new Promise(resolve => {
                    if (!isTraining) return resolve();

                    let attempt = 0;
                    const attemptSpeak = () => {
                        attempt++;
                        const utterance = new SpeechSynthesisUtterance(text);
                        utterance.lang = lang;
                        if (lang.toLowerCase().startsWith("fr")) {
                            utterance.rate = speechRate;
                            if (selectedVoice) utterance.voice = selectedVoice;
                        }
                        pendingUtterances.push(utterance);

                        let settled = false;
                        let started = false;
                        let stallTimer = null;

                        const forget = () => {
                            const i = pendingUtterances.indexOf(utterance);
                            if (i !== -1) pendingUtterances.splice(i, 1);
                            clearTimeout(stallTimer);
                        };

                        const giveUp = () => {
                            settled = true;
                            forget();
                            stopTrainingWithError(
                                `⚠️ Speech failed for "${text}" (${lang}). This can happen when a network voice ` +
                                `stops responding — often after a browser or Windows update changes voice availability. ` +
                                `Training stopped; check Settings > Time & Language > Speech, or try again.`
                            );
                            resolve();
                        };

                        // Network voices can occasionally just never start — no
                        // error event, no end event. Detect that stall and retry
                        // a couple of times before giving up and telling the user.
                        const checkStall = () => {
                            if (started || settled) return;
                            if (speechSynthesis.speaking) {
                                stallTimer = setTimeout(checkStall, STALL_TIMEOUT_MS);
                                return;
                            }
                            forget();
                            speechSynthesis.cancel();
                            if (attempt < MAX_SPEAK_ATTEMPTS) {
                                attemptSpeak();
                            } else {
                                giveUp();
                            }
                        };
                        stallTimer = setTimeout(checkStall, STALL_TIMEOUT_MS);

                        utterance.onstart = () => { started = true; onStart(); };
                        utterance.onend = () => {
                            if (settled) return;
                            settled = true;
                            forget();
                            setTimeout(resolve, 500);
                        };
                        utterance.onerror = () => {
                            if (settled) return;
                            forget();
                            if (!started && attempt < MAX_SPEAK_ATTEMPTS) {
                                attemptSpeak();
                            } else {
                                giveUp();
                            }
                        };

                        speechSynthesis.speak(utterance);
                    };

                    attemptSpeak();
                });
            };

            for (currentIteration = 0; currentIteration < repetitions && isTraining; currentIteration++) {
                for (currentEntry = 0; currentEntry < entries.length; currentEntry++) {
                    if (!isTraining) return;
                    while (isPaused) await new Promise(res => setTimeout(res, 200));

                    progress.textContent = `Iteration: ${currentIteration + 1}/${totalIterations} | Pronounced: ${currentEntry + 1}/${totalEntries}`;
                    const entry = entries[currentEntry];
                    await speak(entry.french, "fr-CA", () => showEntry(entry, false));
                    if (!isTraining) return;
                    await speak(entry.english, "en-US", () => showEntry(entry, true));
                    if (!isTraining) return;
                    await new Promise(res => setTimeout(res, 1000));
                    displayWord.textContent = "";
                }
            }
            isTraining = false;
        }

        function parseEntries(text) {
            return text.split("\n").map(line => {
                const parts = line.split("\t");
                // Optional 4th column (after the [sound:…] tag): IPA in slashes, e.g. /la mɛzɔ̃/.
                const ipa = (parts[3] || "").trim();
                return parts.length >= 2 ? {
                    french: cleanFrenchWord(parts[0].trim()),
                    english: removeSlashes(parts[1].trim()),
                    ipa: /^\/.+\/$/.test(ipa) ? ipa : "",
                } : null;
            }).filter(Boolean);
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
        }

        // Preview of the chosen files: [{ name, entries: [{ french, english, ipa, included }] }].
        // Unticked entries are remembered per file and line, so they stay unticked when other files are added.
        let previewFiles = [];
        const excludedEntries = new Set();
        const entryKey = (file, index) => `${file.name}\n${index}`;
        let previewLoad = Promise.resolve();
        let previewGeneration = 0;

        const preview = document.getElementById("preview");
        const previewSummary = document.getElementById("previewSummary");
        const previewList = document.getElementById("previewList");

        function updatePreviewCounts() {
            const all = previewFiles.flatMap(file => file.entries);
            const included = all.filter(entry => entry.included).length;
            previewSummary.textContent = included === all.length
                ? `Preview: ${all.length} entries`
                : `Preview: ${included} of ${all.length} entries`;
            previewList.querySelectorAll(".file-toggle").forEach(box => {
                const fileEntries = previewFiles[box.dataset.file].entries;
                const fileIncluded = fileEntries.filter(entry => entry.included).length;
                box.checked = fileIncluded === fileEntries.length;
                box.indeterminate = fileIncluded > 0 && fileIncluded < fileEntries.length;
            });
        }

        function renderPreview() {
            preview.classList.toggle("hidden", previewFiles.length === 0);
            previewList.innerHTML = previewFiles.map((file, fileIndex) => `
                <p class="has-text-weight-semibold mt-3">
                    <label class="checkbox"><input type="checkbox" class="file-toggle" data-file="${fileIndex}"> ${escapeHtml(file.name)}</label>
                </p>
                <table class="table is-narrow is-fullwidth"><tbody>${file.entries.map((entry, index) => `
                    <tr>
                        <td><input type="checkbox" class="entry-toggle" data-file="${fileIndex}" data-index="${index}"${entry.included ? " checked" : ""} aria-label="Include ${escapeHtml(entry.french)}"></td>
                        <td><span class="say">${escapeHtml(entry.french)}</span>${entry.ipa ? `<div class="ipa" lang="fr-fonipa">${escapeHtml(entry.ipa)}</div>` : ""}</td>
                        <td>${escapeHtml(entry.english)}</td>
                    </tr>`).join("")}
                </tbody></table>`).join("");
            updatePreviewCounts();
        }

        async function loadPreview() {
            const generation = ++previewGeneration;
            let files;
            try {
                files = await (await libraryFiles)();
            } catch (error) {
                alert(error.message);
                files = [];
            }
            for (let file of document.getElementById("fileInput").files) {
                files.push({ name: file.name, text: await file.text() });
            }
            // A newer selection came in while this one was loading.
            if (generation !== previewGeneration) return;
            previewFiles = files.map(file => ({
                name: file.name,
                entries: parseEntries(file.text).map((entry, index) => ({ ...entry, included: !excludedEntries.has(entryKey(file, index)) })),
            }));
            renderPreview();
        }

        function refreshPreview() {
            previewLoad = loadPreview();
        }

        previewList.addEventListener("change", event => {
            const box = event.target;
            const file = previewFiles[box.dataset.file];
            const setIncluded = (index, included) => {
                file.entries[index].included = included;
                if (included) excludedEntries.delete(entryKey(file, index));
                else excludedEntries.add(entryKey(file, index));
            };
            if (box.classList.contains("file-toggle")) {
                file.entries.forEach((entry, index) => setIncluded(index, box.checked));
                previewList.querySelectorAll(`.entry-toggle[data-file="${box.dataset.file}"]`).forEach(entryBox => entryBox.checked = box.checked);
            } else {
                setIncluded(box.dataset.index, box.checked);
            }
            updatePreviewCounts();
        });

        // Tapping a French word in the preview reads it with the chosen voice and speed (not mid-session).
        previewList.addEventListener("click", event => {
            const word = event.target.closest(".say");
            if (!word || isTraining) return;
            speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(word.textContent);
            utterance.lang = "fr-CA";
            utterance.rate = speechRate;
            if (selectedVoice) utterance.voice = selectedVoice;
            speechSynthesis.speak(utterance);
        });

        const libraryFiles = mountLibraryChecklist(document.getElementById("library"), "vocab", refreshPreview);
        document.getElementById("fileInput").addEventListener("change", refreshPreview);
        // A browser may keep the file input's files on reload.
        refreshPreview();

        document.getElementById("trainButton").addEventListener("click", async () => {
            // Wait for the latest selection to finish loading.
            let loading;
            do {
                loading = previewLoad;
                await loading;
            } while (loading !== previewLoad);

            if (previewFiles.length === 0) {
                alert("Please select at least one file.");
                return;
            }
            entries = previewFiles.flatMap(file => file.entries).filter(entry => entry.included)
                .map(({ french, english, ipa }) => ({ french, english, ipa }));
            if (entries.length === 0) {
                alert("Every entry is unticked in the preview.");
                return;
            }

            const repetitions = parseInt(document.getElementById("repetitions").value, 10);
            const randomize = document.getElementById("randomize").checked;

            if (randomize) {
                entries = entries.sort(() => Math.random() - 0.5);
            }

            train(repetitions);
        });

        document.getElementById("pauseButton").addEventListener("click", () => {
            isPaused = !isPaused;
            document.getElementById("pauseButton").textContent = isPaused ? "Resume" : "Pause";
        });

        document.getElementById("stopButton").addEventListener("click", () => {
            isTraining = false;
            isPaused = false;
            speechSynthesis.cancel();
            document.getElementById("displayWord").textContent = "";
            document.getElementById("progress").textContent = "";
            document.getElementById("speechError").style.display = "none";
        });
    </script>
</body>
</html>
