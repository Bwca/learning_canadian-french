                      forms: ["vais", "vas", "va", "allons", "allez", "vont"],
                      ipa: ["ʒə vɛ", "ty va", "il va", "nu z‿alɔ̃", "vu z‿ale", "il vɔ̃"],
                      meaning: { en: ["I go", "you go", "he / she goes; on: we go", "we go", "you go", "they go"],
                                 uk: ["я йду", "ти йдеш", "він / вона йде; on: ми йдемо", "ми йдемо", "ви йдете", "вони йдуть"] } },
                    { verb: "faire", gloss: { en: "to do, to make", uk: "робити" },
                      forms: ["fais", "fais", "fait", "faisons", "faites", "font"],
                      ipa: ["ʒə fɛ", "ty fɛ", "il fɛ", "nu fəzɔ̃", "vu fɛt", "il fɔ̃"],
                      meaning: { en: ["I do", "you do", "he / she does; on: we do", "we do", "you do", "they do"],
                                 uk: ["я роблю", "ти робиш", "він / вона робить; on: ми робимо", "ми робимо", "ви робите", "вони роблять"] } },
                ],
            },
        ];

        // The regular endings side by side, for the overview in the first section.
        const OVERVIEW = [
            { head: "-er (parler)", endings: ["-e", "-es", "-e", "-ons", "-ez", "-ent"] },
            { head: "-ir (finir)", endings: ["-is", "-is", "-it", "-issons", "-issez", "-issent"] },
            { head: "-ir (partir)", endings: ["-s", "-s", "-t", "-ons", "-ez", "-ent"] },
            { head: "-re (vendre)", endings: ["-s", "-s", "—", "-ons", "-ez", "-ent"] },
        ];

        const esc = i18nEscape;
        const content = (value, tag = "span") => `<${tag} ${contentAttrs(value)}></${tag}>`;
        const sayable = (text, html = esc(text)) => `<span class="say" lang="fr" tabindex="0" role="button" data-i18n-attr="title:hear" data-say="${esc(text)}">${html}</span>`;

        // "je" + "aime" → "j'aime"; the shown pronoun keeps every option (il/elle/on), the spoken one just the first.
        function withPronoun(pronoun, form) {
            const elide = pronoun === "je" && /^[aeiouéèêh]/i.test(form);
            const join = p => (elide ? "j'" : p + " ");
            return { shown: join(pronoun), spoken: join(pronoun.split("/")[0]) + form };
        }

        function verbTable(table) {
            const rows = table.forms.map((form, i) => {
                const { shown, spoken } = withPronoun(PRONOUNS[i], form);
                const ending = table.endings?.[i];
                const formHtml = ending ? esc(form.slice(0, -ending.length)) + `<span class="ending">${esc(ending)}</span>` : esc(form);
                return `<tr>
                    <td>${sayable(spoken, esc(shown) + formHtml)}</td>
                    <td class="ipa">[${esc(table.ipa[i])}]</td>
                    <td>${content({ en: table.meaning.en[i], uk: table.meaning.uk[i] })}</td>
                </tr>`;
            }).join("");
            return `<div class="table-container verb-table"><table class="table is-striped is-fullwidth">
                <caption>${sayable(table.verb)} — ${content(table.gloss)}</caption>
                <thead><tr><th data-i18n="form"></th><th data-i18n="sound"></th><th data-i18n="meaning"></th></tr></thead>
                <tbody>${rows}</tbody></table></div>`;
        }

        function overviewTable() {
            const rows = PRONOUNS.map((pronoun, i) =>
                `<tr><th lang="fr">${esc(pronoun)}</th>${OVERVIEW.map(g => `<td class="ending" lang="fr">${esc(g.endings[i])}</td>`).join("")}</tr>`).join("");
            return `<div class="table-container verb-table"><table class="table is-bordered is-fullwidth">
                <thead><tr><th data-i18n="person"></th>${OVERVIEW.map(g => `<th lang="fr">${esc(g.head)}</th>`).join("")}</tr></thead>
                <tbody>${rows}</tbody></table></div>`;
        }

        function changesTable(changes) {
            const rows = changes.rows.map(r => `<tr>
                <td>${sayable(r.verb)}</td><td>${sayable(r.je)}</td><td>${sayable(r.nous)}</td><td>${content(r.why)}</td>
            </tr>`).join("");
            return `<h3 class="title is-5 mt-5">${content(changes.title)}</h3>
                <p>${content(changes.rule)}</p>
                <div class="table-container verb-table"><table class="table is-striped is-fullwidth">
                <thead><tr><th data-i18n="verb"></th><th lang="fr">je</th><th lang="fr">nous</th><th data-i18n="why"></th></tr></thead>
                <tbody>${rows}</tbody></table></div>`;
        }

        const sections = document.getElementById("sections");
        sections.innerHTML = SECTIONS.map(s => `<section class="section-block" id="${s.id}">
            <h2 class="title is-4">${content(s.title)}</h2>
            <ul class="rules">${s.rules.map(r => content(r, "li")).join("")}</ul>
            ${s.overview ? overviewTable() : ""}
            ${(s.tables || []).map(verbTable).join("")}
            ${s.changes ? changesTable(s.changes) : ""}
        </section>`).join("");
        document.getElementById("toc").innerHTML = SECTIONS.map(s => `<a href="#${s.id}" ${contentAttrs(s.title)}></a>`).join(" ");

        // --- Speech: click (or Enter on) a French form to hear it ---
        let frenchVoice = null;
        function pickVoice() {
            const voices = speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith("fr"));
            const ca = voices.filter(v => v.lang.toLowerCase() === "fr-ca");
            frenchVoice = ca.find(v => v.localService) || ca[0] || voices.find(v => v.localService) || voices[0] || null;
        }
        if ("speechSynthesis" in window) {
            pickVoice();
            speechSynthesis.addEventListener("voiceschanged", pickVoice);
        }

        // Chrome can drop an utterance that nothing references before it's spoken, so keep the current one.
        let currentUtterance = null;
        function speak(text) {
            if (!("speechSynthesis" in window)) return;
            speechSynthesis.cancel();
            currentUtterance = new SpeechSynthesisUtterance(text);
            currentUtterance.lang = frenchVoice ? frenchVoice.lang : "fr-CA";
            if (frenchVoice) currentUtterance.voice = frenchVoice;
            currentUtterance.rate = 0.9;
            speechSynthesis.speak(currentUtterance);
        }

        sections.addEventListener("click", event => {
            const target = event.target.closest(".say");
            if (target) speak(target.dataset.say);
        });
        sections.addEventListener("keydown", event => {
            const target = event.target.closest(".say");
            if (target && (event.key === "Enter" || event.key === " ")) {
                event.preventDefault();
                speak(target.dataset.say);
            }
        });
    </script>
</body>
</html>
