<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pageTitle">English Vocabulary Test</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/0.9.4/css/bulma.min.css">
    <style>
        .container { max-width: 800px; margin: auto; text-align: center; }
        .columns { margin-top: 20px; }
        .correct { background-color: #d4edda; }
        .incorrect { background-color: #f8d7da; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <nav class="page-nav level is-mobile mb-4">
            <a href="index.html">← <span data-i18n="allTools">All tools</span></a>
        </nav>
        <h1 class="title" data-i18n="pageTitle">English Vocabulary Test</h1>
        <div class="field hidden" id="library"></div>
        <div class="field">
            <div class="file has-name is-boxed">
                <label class="file-label">
                    <input class="file-input" type="file" id="fileInput" accept=".txt">
                    <span class="file-cta">
                        <span class="file-label" data-i18n="chooseFile">Choose a file…</span>
                    </span>
                </label>
            </div>
        </div>
        <div id="testForm" class="hidden">
            <div class="columns is-multiline" id="wordList"></div>
            <button class="button is-primary" id="checkButton" data-i18n="checkAnswers">Check Answers</button>
            <p id="score" class="mt-4"></p>
        </div>
    </div>
    <script src="../i18n.js"></script>
    <script src="../library.js"></script>
    <script>
        defineStrings({
            en: {
                pageTitle: "English Vocabulary Test",
                chooseFile: "Choose a file…",
                pickList: "Pick a vocabulary list…",
                checkAnswers: "Check Answers",
                correctIs: "Correct:",
            },
            uk: {
                pageTitle: "Тест з англійських слів",
                chooseFile: "Виберіть файл…",
                pickList: "Виберіть список слів…",
                checkAnswers: "Перевірити відповіді",
                correctIs: "Правильно:",
            },
        });

        mountLibrarySelect(document.getElementById("library"), "vocab", "pickList", renderQuiz);

        document.getElementById("fileInput").addEventListener("change", async function () {
            const file = this.files[0];
            if (!file) return;
            renderQuiz(await file.text());
        });

        function renderQuiz(text) {
            const entries = text.split("\n").map(line => {
                const parts = line.split("\t");
                // Column 1 is the English, column 2 its Ukrainian translation. Notes in parentheses aren't
                // part of the answer, "/"-separated alternatives are each accepted, and a verb's "to" is optional.
                if (parts.length < 2) return null;
                const english = parts[0].trim();
                const answers = english.replace(/\(.*?\)/g, "").split("/").map(a => a.replace(/\s+/g, " ").trim()).filter(Boolean);
                return { translation: parts[1].trim(), english, answers };
            }).filter(Boolean);
            
            const wordList = document.getElementById("wordList");
            wordList.innerHTML = "";
            entries.forEach((entry, index) => {
                const div = document.createElement("div");
                div.classList.add("column", "is-half", "is-one-third-mobile");
                div.innerHTML = `
                    <div class="box">
                        <p><strong lang="uk">${i18nEscape(entry.translation)}</strong></p>
                        <input class="input answer" type="text" lang="en" autocapitalize="off" data-answers="${i18nEscape(JSON.stringify(entry.answers))}">
                        <p class="correct-answer hidden"><span data-i18n="correctIs"></span> <span lang="en">${i18nEscape(entry.english)}</span></p>
                        <label class="checkbox hidden">
                            <input type="checkbox" class="override-correct"> <span data-i18n="markCorrect"></span>
                        </label>
                    </div>`;
                wordList.appendChild(div);
            });
            applyTranslations(wordList);
            document.getElementById("testForm").classList.remove("hidden");
            clearText(document.getElementById("score"));
        }
        
        document.getElementById("checkButton").addEventListener("click", function () {
            let correctCount = 0;
            const inputs = document.querySelectorAll(".answer");
            inputs.forEach(input => {
                const normalize = text => text.replace(/[’‘]/g, "'").replace(/\s+/g, " ").trim().toLowerCase().replace(/^to /, "");
                const userAnswer = normalize(input.value);
                const answers = JSON.parse(input.dataset.answers).map(normalize);
                const correctAnswerDisplay = input.nextElementSibling;
                const checkbox = input.parentElement.querySelector(".override-correct");
                
                if (answers.includes(userAnswer)) {
                    input.classList.add("correct");
                    input.classList.remove("incorrect");
                    correctCount++;
                } else {
                    input.classList.add("incorrect");
                    input.classList.remove("correct");
                    correctAnswerDisplay.classList.remove("hidden");
                }
                
                checkbox.parentElement.classList.remove("hidden");
                checkbox.checked = false;
                checkbox.addEventListener("change", updateScore);
            });
            updateScore();
        });
        
        function updateScore() {
            let correctCount = 0;
            document.querySelectorAll(".answer").forEach(input => {
                const checkbox = input.parentElement.querySelector(".override-correct");
                if (input.classList.contains("correct") || checkbox.checked) {
                    correctCount++;
                }
            });
            const total = document.querySelectorAll(".answer").length;
            setText(document.getElementById("score"), "score",
                { correct: correctCount, total, percent: Math.round((correctCount / total) * 100) });
        }
    </script>
</body>
</html>
