<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>French Translation Drill</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/0.9.4/css/bulma.min.css">
    <style>
        .container { max-width: 800px; margin: auto; text-align: center; }
        .exercise-box { text-align: left; }
        .prompt { font-size: 20px; font-weight: bold; }
        .vocab-hints { margin: 10px 0; }
        .vocab-hints .tag { cursor: pointer; margin-right: 6px; margin-bottom: 6px; }
        .correct { background-color: #d4edda; }
        .incorrect { background-color: #f8d7da; }
        .hidden { display: none; }
        .correct-answer { margin-top: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">French Translation Drill</h1>
        <p class="subtitle is-6">
            Translate each sentence into French, then check your answers. Click a vocabulary tag to hear it.
            Checking is exact-match, so use "Mark as Correct" for valid phrasings that differ from the reference.
        </p>
        <div class="field">
            <div class="file has-name is-boxed">
                <label class="file-label">
                    <input class="file-input" type="file" id="fileInput" accept=".json">
                    <span class="file-cta">
                        <span class="file-label">Choose an exercise…</span>
                    </span>
                </label>
            </div>
        </div>
        <div id="exerciseForm" class="hidden">
            <h2 class="subtitle" id="exerciseTitle"></h2>
            <div id="exerciseList"></div>
            <div class="buttons is-centered">
                <button class="button is-primary" id="checkButton">Check Answers</button>
                <button class="button is-info" id="readAllButton" disabled>🔊 Read All Corrections</button>
            </div>
            <p id="score" class="mt-4"></p>
        </div>
    </div>
    <script>
        let exercises = [];

        function speak(text, lang) {
            return new Promise(resolve => {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.onend = resolve;
                utterance.onerror = resolve;
                speechSynthesis.speak(utterance);
            });
        }

        document.getElementById("fileInput").addEventListener("change", async function () {
            const file = this.files[0];
            if (!file) return;
            const data = JSON.parse(await file.text());
            exercises = data.exercises || [];

            document.getElementById("exerciseTitle").textContent = data.title || "";
            const list = document.getElementById("exerciseList");
            list.innerHTML = "";

            exercises.forEach((exercise, index) => {
                const box = document.createElement("div");
                box.classList.add("box", "exercise-box");

                const vocabHtml = (exercise.vocab || [])
                    .map(v => `<span class="tag is-light" data-fr="${v.fr}">🔊 ${v.fr} — ${v.en}</span>`)
                    .join("");

                box.innerHTML = `
                    <p class="prompt">${index + 1}. ${exercise.en}</p>
                    <div class="vocab-hints">${vocabHtml}</div>
                    <input class="input answer" type="text" data-correct="${exercise.fr}" placeholder="Your translation…">
                    <p class="correct-answer hidden"></p>
                    <label class="checkbox hidden override-label">
                        <input type="checkbox" class="override-correct"> Mark as Correct
                    </label>
                `;
                list.appendChild(box);
            });

            list.querySelectorAll(".vocab-hints .tag").forEach(tag => {
                tag.addEventListener("click", () => speak(tag.dataset.fr, "fr-CA"));
            });

            document.getElementById("exerciseForm").classList.remove("hidden");
            document.getElementById("readAllButton").disabled = true;
            document.getElementById("score").textContent = "";
        });

        document.getElementById("checkButton").addEventListener("click", function () {
            document.querySelectorAll(".answer").forEach(input => {
                const userAnswer = input.value.trim().toLowerCase();
                const correctAnswer = input.dataset.correct.toLowerCase();
                const correctAnswerDisplay = input.nextElementSibling;
                const overrideLabel = correctAnswerDisplay.nextElementSibling;
                const checkbox = overrideLabel.querySelector(".override-correct");

                if (userAnswer === correctAnswer) {
                    input.classList.add("correct");
                    input.classList.remove("incorrect");
                } else {
                    input.classList.add("incorrect");
                    input.classList.remove("correct");
                    correctAnswerDisplay.innerHTML = `Correct: ${input.dataset.correct} <button class="button is-small is-info speak-correction" type="button">🔊</button>`;
                    correctAnswerDisplay.classList.remove("hidden");
                    correctAnswerDisplay.querySelector(".speak-correction")
                        .addEventListener("click", () => speak(input.dataset.correct, "fr-CA"));
                }

                overrideLabel.classList.remove("hidden");
                checkbox.checked = false;
                checkbox.addEventListener("change", updateScore);
            });
            updateScore();
            document.getElementById("readAllButton").disabled = false;
        });

        function updateScore() {
            const inputs = document.querySelectorAll(".answer");
            let correctCount = 0;
            inputs.forEach(input => {
                const overrideLabel = input.nextElementSibling.nextElementSibling;
                const checkbox = overrideLabel.querySelector(".override-correct");
                if (input.classList.contains("correct") || checkbox.checked) {
                    correctCount++;
                }
            });
            document.getElementById("score").textContent =
                `Score: ${correctCount} / ${inputs.length} (${Math.round((correctCount / inputs.length) * 100)}%)`;
        }

        document.getElementById("readAllButton").addEventListener("click", async () => {
            for (const exercise of exercises) {
                await speak(exercise.fr, "fr-CA");
                await new Promise(res => setTimeout(res, 700));
            }
        });
    </script>
</body>
</html>
